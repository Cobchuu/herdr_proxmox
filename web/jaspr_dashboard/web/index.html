<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herdr · Proxmox</title>
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const queryTheme = new URLSearchParams(location.search).get('theme');
      const savedTheme = localStorage.getItem('herdr.theme') || localStorage.getItem('herdr-theme');
      const theme = queryTheme || savedTheme;
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/org-chart.css">
  <link rel="stylesheet" href="css/task-workflow.css">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <script src="vendor/xterm/xterm.js"></script>
  <script defer src="main.dart.js"></script>
</head>
